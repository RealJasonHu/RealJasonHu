<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc">
  <title id="title">Jason Hu — AI research and open-source engineering</title>
  <desc id="desc">Jason Hu builds reproducible, inspectable tools for browser debugging, visual regression review, and world-model testing: ReproCut, RenderWitness, and DreamFuzz.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0D1117"/>
      <stop offset="1" stop-color="#14232E"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#74E2C0"/>
      <stop offset="1" stop-color="#8CBFFF"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#FFFFFF" stroke-opacity="0.035"/>
    </pattern>
    <clipPath id="frame"><rect x="1" y="1" width="1198" height="338" rx="20"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1200" height="340" fill="url(#background)"/>
    <rect width="1200" height="340" fill="url(#grid)"/>
    <rect x="0" y="0" width="1200" height="4" fill="url(#accent)"/>
    <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif">
      <text x="58" y="58" fill="#74E2C0" font-size="13" font-weight="700" letter-spacing="2.6">AI RESEARCH / OPEN-SOURCE ENGINEERING</text>
      <text x="55" y="147" fill="#F0F6FC" font-size="76" font-weight="700" letter-spacing="-2">Jason Hu</text>
      <text x="59" y="195" fill="#CCD8E4" font-size="24">Make failures reproducible.</text>
      <text x="59" y="228" fill="#CCD8E4" font-size="24">Make evidence inspectable.</text>
      <text x="60" y="291" fill="#91A5B7" font-size="14" letter-spacing="0.5">World models · Multimodal AI · Developer tools</text>
      <line x1="704" y1="56" x2="704" y2="287" stroke="#71869A" stroke-opacity="0.3"/>
      <g transform="translate(752 54)">
        <text x="0" y="0" fill="#91A5B7" font-size="11" font-weight="600" letter-spacing="2">SELECTED WORK</text>
        <rect x="0" y="22" width="386" height="62" rx="9" fill="#0D1822" stroke="#344957"/>
        <rect x="0" y="100" width="386" height="62" rx="9" fill="#0D1822" stroke="#344957"/>
        <rect x="0" y="178" width="386" height="62" rx="9" fill="#0D1822" stroke="#344957"/>
        <text x="18" y="47" fill="#74E2C0" font-size="17" font-weight="650">ReproCut</text>
        <text x="18" y="67" fill="#B4C3D1" font-size="12">Smaller browser reproducers. Same bug.</text>
        <text x="18" y="125" fill="#8CBFFF" font-size="17" font-weight="650">RenderWitness</text>
        <text x="18" y="145" fill="#B4C3D1" font-size="12">Visual changes, backed by inspectable evidence.</text>
        <text x="18" y="203" fill="#C4B5FD" font-size="17" font-weight="650">DreamFuzz</text>
        <text x="18" y="223" fill="#B4C3D1" font-size="12">Find, shrink, and replay world-model failures.</text>
      </g>
    </g>
  </g>
  <rect x="1" y="1" width="1198" height="338" rx="20" fill="none" stroke="#344957"/>
</svg>
