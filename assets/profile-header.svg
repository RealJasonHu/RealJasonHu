<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc">
  <title id="title">Zhexun Hu — Building reliable AI systems</title>
  <desc id="desc">A dark technical banner for RealJasonHu, focused on world models, VLM testing, and developer tools.</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071216" />
      <stop offset="0.56" stop-color="#0A1920" />
      <stop offset="1" stop-color="#11142A" />
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#57F2C2" />
      <stop offset="0.52" stop-color="#72A7FF" />
      <stop offset="1" stop-color="#B69CFF" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#72A7FF" stop-opacity="0.26" />
      <stop offset="1" stop-color="#72A7FF" stop-opacity="0" />
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#D7F9EE" stroke-opacity="0.055" stroke-width="1" />
    </pattern>
    <filter id="soft-glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <clipPath id="frame">
      <rect x="1" y="1" width="1198" height="338" rx="28" />
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="340" fill="url(#background)" />
    <rect width="1200" height="340" fill="url(#grid)" />
    <circle cx="1000" cy="170" r="290" fill="url(#glow)" />
    <path d="M0 319C216 263 366 326 564 276C740 231 906 92 1200 80" fill="none" stroke="url(#accent)" stroke-opacity="0.18" stroke-width="2" />
    <path d="M0 335C231 286 386 344 587 294C784 245 942 119 1200 106" fill="none" stroke="url(#accent)" stroke-opacity="0.08" stroke-width="1" />

    <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif">
      <text x="68" y="69" fill="#57F2C2" font-size="15" font-weight="700" letter-spacing="4">REALJASONHU / BUILDER</text>
      <rect x="68" y="88" width="84" height="4" rx="2" fill="url(#accent)" />
      <text x="66" y="166" fill="#F4FBF9" font-size="70" font-weight="750" letter-spacing="1">ZHEXUN HU</text>
      <text x="70" y="213" fill="#B7C8C8" font-size="22" font-weight="500" letter-spacing="2.4">SHIPPING EVIDENCE-FIRST AI TOOLS</text>
      <text x="70" y="276" fill="#7F9799" font-size="14" font-weight="650" letter-spacing="2.1">WORLD MODELS  /  VISUAL AI  /  OPEN SOURCE</text>
    </g>

    <g transform="translate(928 170)">
      <ellipse rx="174" ry="75" fill="none" stroke="#72A7FF" stroke-opacity="0.28" stroke-width="1.5" transform="rotate(-16)" />
      <ellipse rx="124" ry="124" fill="none" stroke="#57F2C2" stroke-opacity="0.2" stroke-width="1.5" transform="rotate(28)" />
      <ellipse rx="72" ry="153" fill="none" stroke="#B69CFF" stroke-opacity="0.24" stroke-width="1.5" transform="rotate(56)" />
      <circle r="34" fill="#0B2025" stroke="url(#accent)" stroke-width="2" />
      <circle r="7" fill="#57F2C2" filter="url(#soft-glow)" />
      <circle cx="135" cy="-45" r="6" fill="#72A7FF" filter="url(#soft-glow)" />
      <circle cx="-88" cy="-88" r="5" fill="#B69CFF" filter="url(#soft-glow)" />
      <circle cx="-116" cy="61" r="5" fill="#FFCF70" filter="url(#soft-glow)" />
      <path d="M-109 57L-8 5L129-42" fill="none" stroke="#D7F9EE" stroke-opacity="0.32" stroke-width="1" stroke-dasharray="5 7" />
      <path d="M-84-84L-4-5L129-42" fill="none" stroke="#D7F9EE" stroke-opacity="0.2" stroke-width="1" stroke-dasharray="4 8" />
    </g>

    <g fill="#D7F9EE" fill-opacity="0.34">
      <circle cx="1138" cy="48" r="2" />
      <circle cx="1091" cy="288" r="2" />
      <circle cx="774" cy="62" r="2" />
      <circle cx="824" cy="292" r="2" />
    </g>
  </g>

  <rect x="1" y="1" width="1198" height="338" rx="28" fill="none" stroke="#D7F9EE" stroke-opacity="0.13" stroke-width="2" />
</svg>
